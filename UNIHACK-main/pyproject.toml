[project]
name = "unihack"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.22.0",
    "pdfplumber>=0.9.0",
    "python-multipart>=0.0.6",
    "psycopg2-binary>=2.9.6",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "faiss-cpu>=1.7.4",
    "google-genai>=0.1.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
